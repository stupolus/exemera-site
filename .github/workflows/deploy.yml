# Публикация сайта Exemera на GitHub Pages при каждом изменении в main.
#
# СЕЙЧАС САЙТ СНЯТ С ПУБЛИКАЦИИ.
# Выкладывается каталог .pages-offline, в нём только страница-заглушка,
# поэтому все адреса отдают 404, а содержимое сайта публично недоступно.
# Сами страницы никуда не делись — они лежат в репозитории как лежали.
#
# ЧТОБЫ ВЕРНУТЬ САЙТ: заменить ниже path: ./.pages-offline обратно на path: .
# и смержить в main. Деплой поднимет сайт за пару минут.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          # сайт снят с публикации: вместо корня репозитория выкладывается
          # каталог с одной заглушкой. Вернуть сайт — поставить обратно  path: .
          path: ./.pages-offline
      - id: deployment
        uses: actions/deploy-pages@v4
