<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница не найдена — Exemera</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- Страница 404 самодостаточна: инлайн-стили и без внешних ассетов,
       потому что GitHub Pages отдаёт её с любого несуществующего пути
       и относительные ссылки на css/шрифты там бы ломались. -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #faf8f4;
      color: #2b241b;
      font-family: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .code {
      font-size: clamp(72px, 18vw, 160px);
      font-weight: 800;
      line-height: 1;
      color: #8a6f45;
      letter-spacing: 0.02em;
    }
    h1 {
      font-size: clamp(20px, 4vw, 28px);
      margin-top: 16px;
      font-weight: 600;
    }
    p {
      margin-top: 12px;
      color: #6e6353;
      font-size: 16px;
      line-height: 1.6;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
    }
    a.btn {
      display: inline-block;
      margin-top: 28px;
      padding: 14px 28px;
      border-radius: 999px;
      background: #8a6f45;
      color: #faf8f4;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: background 160ms ease, transform 160ms ease;
    }
    a.btn:hover { background: #b89b6f; }
    a.btn:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Такой страницы нет</h1>
    <p>Возможно, ссылка устарела или в адресе опечатка. Всё главное — на первой странице.</p>
    <a class="btn" href="./">На главную</a>
  </main>
</body>
</html>
